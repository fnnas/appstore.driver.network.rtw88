name: kernel-6.6.38-trim-92.yml
permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: write   # Allows triggering actions

on:
  workflow_call:  # This allows this workflow to be called from another workflow
    inputs:
      proj_name:
        required: true
        type: string
        default: "rtw88"
      rtw88_commit_sha:
        required: true
        type: string
        default: "HEAD"
jobs:
  build_6-6-38-trim-92:
    runs-on: ubuntu-latest
    container:
      image: makedie/fnos:kernHead-6.6.38-trim-92
      options: -v ${{ github.workspace }}:${{ github.workspace }}
    env:
      kernel_name: "6.6.38-trim_92"
    steps:
      - name: Check out repository code
        run: |
          git clone https://github.com/lwfinger/rtw88
          cd rtw88 && git reset --hard ${{ inputs.rtw88_commit_sha }}
      - name: build ko
        run: |
          cd rtw88 && make -j`nproc`
      - name: copy ko
        run: |
          mkdir -p upload/${{ inputs.proj_name }}_${{ env.kernel_name }}
          cp rtw88/*.ko upload/${{ inputs.proj_name }}_${{ env.kernel_name }}/
      - name: upload ko
        uses: actions/upload-artifact@master
        with:
          name: ${{ inputs.proj_name }}-${{ inputs.rtw88_commit_sha }}-${{ env.kernel_name }}
          path: upload
